[package]
name = "papyrus-stories"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["lib", "launch"] }

[dev-dependencies]
dioxus-ssr = "=0.7.10"
dioxus-html = { version = "=0.7.10", features = ["serialize"] }

[features]
default = ["web"]
# Web history in 0.7.10 gets its required Location API from devtools.
web = ["dioxus/web", "dioxus/devtools"]
embedded-style = []

[[bin]]
name = "papyrus-web"
path = "src/main.rs"
required-features = ["web"]
