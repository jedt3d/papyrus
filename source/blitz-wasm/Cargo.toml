[package]
name = "papyrus-blitz-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
papyrus-stories = { path = "..", default-features = false, features = ["embedded-style"] }
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "7832c177ff272128154bac58afe56c2b9164b417", default-features = false, features = ["vello-hybrid", "woff", "complex-scripts", "data-uri"] }
anyrender_vello_hybrid = { version = "=0.11.0", features = ["webgl"] }
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "=0.1.7"
