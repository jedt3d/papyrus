<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Papyrus — Blitz WASM</title>
    <script>
      // Record the context actually opened; enabling a feature does not select a backend.
      const nativeGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function(type, ...options) {
        const context = nativeGetContext.call(this, type, ...options);
        if (context) this.setAttribute("data-graphics-context", type);
        return context;
      };
    </script>
